name: Repository Path Integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  path-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate tracked repository paths
        run: node scripts/check-repository-paths.mjs
